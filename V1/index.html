<!DOCTYPE html>
<html lang="en">

<head>

    <title>Nesne Bulma Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="islemler">
            <button type="button" class="btn btn-baslat">Oyunu Başlat</button>
            <h4> Puan: <span class="puan">100</span></h4>
            <button type="button" class="btn btn-nasil">Nasıl Oynanır?</button>
        </div>
        <div class="butonlar">
            <button id="1" class="kare"><span class="sayi">1</span></button>
            <button id="2" class="kare"><span class="sayi">1</span></button>
            <button id="3" class="kare"><span class="sayi">1</span></button>
            <button id="4" class="kare"><span class="sayi">1</span></button>
            <button id="5" class="kare"><span class="sayi">1</span></button>
            <button id="6" class="kare"><span class="sayi">1</span></button>
            <button id="7" class="kare"><span class="sayi">1</span></button>
            <button id="8" class="kare"><span class="sayi">1</span></button>
            <button id="9" class="kare"><span class="sayi">1</span></button>
        </div>

        <div class="nasil-oynanir">
            <h3>Nasıl Oynanır?</h3>
            <p>Butona tıklandığında gösterilen sayı, nesnenin butona kaç kare uzaklıkta olduğunu gösterir.</p>
        </div>
    </div>


    <script src="app.js"></script>
</body>

</html>
