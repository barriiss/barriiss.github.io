<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <title>Frontend Mentor | QR code component</title>
    <style>
        .attribution {
            font-size: 0.6875rem;
            text-align: center;
        }

        .attribution a {
            color: hsl(228, 45%, 44%);
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <section class="card">
            <article class="card-image">
            <img src="images/image-qr-code.png" alt="QR code linking to Frontend Mentor" width="576" height="576"
                class="card-img">
        </article>

        <div class="card-text-content">
            <h1 class="card-title">Improve your front-end skills by building projects</h1>
            <p class="card-text">Scan the QR code to visit Frontend Mentor and take your coding skills to the
                next level
            </p>
        </div>
            
        </section>
        
            <footer class="attribution">
                Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
                Coded by <a href="#">Barış</a>.
            </footer>
        
    </main>

</body>

</html>
